# OCTC agent templates — drift check
name: OCTC agents

on:
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - ".octc/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/octc-agents.yml"
  pull_request:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - ".octc/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/octc-agents.yml"
  workflow_dispatch: {}

concurrency:
  group: octc-agents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: octc-agents verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          version: 10.28.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify provenance of registry packages (incl. @1c2c/*)
        run: npm audit signatures
      - run: pnpm run octc:agents:verify
