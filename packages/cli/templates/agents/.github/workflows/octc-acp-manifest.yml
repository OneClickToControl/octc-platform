# Validate ACP manifest (pin to octc-platform commit; bump OCTC_PLATFORM_PIN when schema changes).
name: octc-acp-manifest

on:
  pull_request:
    paths:
      - "agents/__PRODUCT__-acp/manifest.json"
      - ".github/workflows/octc-acp-manifest.yml"
  push:
    branches: [main]
    paths:
      - "agents/__PRODUCT__-acp/manifest.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate ACP manifest (JSON Schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Fetch OCTC schema from octc-platform (pinned ref)
        env:
          # Bump when upgrading schema: use full commit SHA from OneClickToControl/octc-platform
          # that contains schemas/octc-agent-provider.manifest.v1.json
          OCTC_PLATFORM_PIN: d23c4a769bc06f00c2908896a702849036b0b56e
        run: |
          set -euo pipefail
          SCHEMA_URL="https://raw.githubusercontent.com/OneClickToControl/octc-platform/${OCTC_PLATFORM_PIN}/schemas/octc-agent-provider.manifest.v1.json"
          curl -fsSL "$SCHEMA_URL" -o /tmp/octc-agent-provider.manifest.v1.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/octc-agent-provider.manifest.v1.json','utf8'))"

      - name: Validate agents/__PRODUCT__-acp/manifest.json
        run: |
          npx --yes ajv-cli@5 validate \
            -s /tmp/octc-agent-provider.manifest.v1.json \
            -d agents/__PRODUCT__-acp/manifest.json \
            --spec=draft2020
