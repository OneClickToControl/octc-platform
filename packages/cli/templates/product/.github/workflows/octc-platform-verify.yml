# Contrato mínimo @1c2c/* — firmas npm + octc verify monorepo (ADR-0003).
# Productos docs_first y standard comparten este shell; lint/build de superficies van en workflows aparte.
name: OCTC platform verify

on:
  push:
    branches: [main]
    paths:
      - ".octc/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**"
      - ".github/workflows/octc-platform-verify.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: octc-platform-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  octc-shell:
    name: signatures & monorepo verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          version: 9.12.3

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures (@1c2c/* provenance)
        run: pnpm dlx audit-signatures || npm audit signatures

      - name: octc verify monorepo
        run: pnpm exec octc verify monorepo
