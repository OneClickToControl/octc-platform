# OAO fase B — PR cerrado → dispatch a octc-platform-internal (emit operation.*).
# Callable SSOT: octc-platform. Secret org: OCTC_PORTFOLIO_DISPATCH_TOKEN (o OCTC_ACP_DISPATCH_TOKEN).
# Pin: octc-platform/scripts/print-factory-oao-notify-callable-pin.sh
name: OCTC factory operation notify (OAO)

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: vars.OCTC_RELEASE_MERGE_ENABLED == 'true'
    uses: OneClickToControl/octc-platform/.github/workflows/octc-factory-oao-notify-callable.yml@__OCTC_FACTORY_OAO_NOTIFY_PIN__
    with:
      target_repo: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
      merged: ${{ github.event.pull_request.merged }}
    secrets: inherit
