# Reusable: repository_dispatch → octc-platform-internal (OAO operation.completed|failed).
# Call from *-app on pull_request closed. Secret org: OCTC_PORTFOLIO_DISPATCH_TOKEN (o OCTC_ACP_DISPATCH_TOKEN).
# Pin: ./scripts/print-factory-oao-notify-callable-pin.sh
name: OCTC factory OAO notify (callable)

on:
  workflow_call:
    inputs:
      target_repo:
        description: "owner/repo del PR cerrado"
        type: string
        required: true
      pr_number:
        description: "Número de PR"
        type: number
        required: true
      merged:
        description: "PR merged"
        type: boolean
        required: true
      internal_repo:
        description: "Repo receptor del dispatch (sin org)"
        type: string
        required: false
        default: octc-platform-internal

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: repository_dispatch (octc_factory_oao_notify)
        env:
          OCTC_ACP_DISPATCH_TOKEN: ${{ secrets.OCTC_ACP_DISPATCH_TOKEN }}
          OCTC_PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.OCTC_PORTFOLIO_DISPATCH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          INTERNAL_REPO: ${{ inputs.internal_repo }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGED: ${{ inputs.merged }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 << 'PY'
          import json
          import os
          import urllib.request

          token = (os.environ.get("OCTC_ACP_DISPATCH_TOKEN") or "").strip() or (
              os.environ.get("OCTC_PORTFOLIO_DISPATCH_TOKEN") or ""
          ).strip()
          if not token:
              raise SystemExit(
                  "Missing secret: OCTC_PORTFOLIO_DISPATCH_TOKEN or OCTC_ACP_DISPATCH_TOKEN "
                  "(permission to POST .../dispatches on internal)."
              )

          owner = os.environ["OWNER"]
          internal = os.environ["INTERNAL_REPO"]
          merged_raw = os.environ.get("MERGED", "").strip().lower()
          merged = merged_raw in ("true", "1", "yes")

          payload = {
              "event_type": "octc_factory_oao_notify",
              "client_payload": {
                  "target_repo": os.environ["TARGET_REPO"],
                  "pr_number": int(os.environ["PR_NUMBER"]),
                  "merged": merged,
                  "source_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              },
          }
          body = json.dumps(payload).encode("utf-8")
          url = f"https://api.github.com/repos/{owner}/{internal}/dispatches"
          req = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          urllib.request.urlopen(req, timeout=60)
          print("dispatch OK →", url, payload["client_payload"])
          PY
